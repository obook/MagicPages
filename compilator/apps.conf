# Applications publiables par publier.sh
#
# Un enregistrement par ligne, quatre champs séparés par "|" :
#   nom      : clé passée en argument à publier.sh
#   source   : dossier du dépôt Android (celui qui contient gradlew), relatif
#              à DOSSIER_PROJETS défini dans secret.sh. Ce fichier reste ainsi
#              identique sur tous les postes. Un chemin absolu est accepté
#              pour un dépôt rangé ailleurs que les autres.
#   dossier  : dossier de l'application sur le serveur, sous FTP_CHEMIN
#              (attention à la casse : le FTP y est sensible)
#   fichier  : nom du fichier .apk sur le serveur
#
# nom|source|dossier|fichier
calculatirce|calculatirce|Calculatirce|calculatirce_demo.apk
cardscaneye|CardScanEye|CardScanEye|cardscaneye_demo.apk
